name: CI

# Garantia de qualidade da ferramenta (Sprint 2): lint, verificação de tipos e build a cada
# push e Pull Request. A análise estática roda no SonarCloud pela análise automática, ligada
# ao repositório; a configuração dela está em .sonarcloud.properties.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  qualidade:
    name: Lint, tipos e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts: nenhum pacote executa código durante a instalação. O único passo
      # necessário depois dela, gerar o cliente do Prisma, roda explicitamente a seguir.
      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Gerar cliente do Prisma
        run: npm run db:generate

      - name: Lint
        run: npm run lint -- app components lib scripts

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Valores de placeholder: o build não acessa o banco nem o provedor de IA.
          DATABASE_URL: file:./build.db
          NEXTAUTH_SECRET: build-only-secret
          NEXTAUTH_URL: http://localhost:3000
