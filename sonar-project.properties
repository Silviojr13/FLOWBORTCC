# Análise estática do FlowBot no SonarCloud/SonarQube.
# A chave do projeto e a organização são definidas no painel do Sonar; o token fica no
# segredo SONAR_TOKEN do repositório (nunca neste arquivo).

sonar.projectKey=Silviojr13_FLOWBORTCC
sonar.organization=silviojr13
sonar.projectName=FlowBot
sonar.projectVersion=1.1

# Código analisado
sonar.sources=app,components,lib,scripts,auth.ts,proxy.ts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

sonar.sourceEncoding=UTF-8

# Fora da análise: dependências, build, artefatos e código gerado
sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  public/**,\
  prisma/migrations/**,\
  **/*.config.mjs,\
  **/*.config.ts,\
  components/ui/**

# components/ui é código de terceiros (shadcn/ui) copiado para o projeto; é mantido fora
# da análise para não poluir as métricas com dívida que não é da equipe.
