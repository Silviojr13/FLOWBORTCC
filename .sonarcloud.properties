# Análise estática do FlowBot no SonarCloud (análise automática, sem token nem passo no CI).
# Projeto: Silviojr13_FLOWBORTCC · Organização: silviojr13

# Código analisado
sonar.sources=app,components,lib,scripts,auth.ts,proxy.ts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

sonar.sourceEncoding=UTF-8

# Fora da análise: build, artefatos, código gerado e código de terceiros
sonar.exclusions=\
  .next/**,\
  public/**,\
  prisma/migrations/**,\
  **/*.config.mjs,\
  **/*.config.ts,\
  components/ui/**

# components/ui é código de terceiros (shadcn/ui) copiado para o projeto; fica fora da
# análise para não poluir as métricas com dívida que não é da equipe.
